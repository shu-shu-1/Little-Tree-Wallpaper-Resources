# 主题元数据模板（不要把本文件加入 theme/index.json）

type = "theme"
id = "com.example.my-theme"
name = "我的主题"
version = "1.0.0"
summary = "一句话简介：主题风格与特点"

# 详细描述（Markdown）
description_md = """
## 介绍

这是一个示例主题。

## 特性

- 配色：……
- 字体：……

## 预览

可在这里放预览说明。
"""

icon_path = "src/icons/my-theme.png"

# 兼容：外部直链（不推荐）
# icon_url = "https://example.com/theme-icon.png"

# 或使用 base64（图标字段三选一：icon_url / icon_data_uri / icon_base64+icon_mime；推荐 Data URI）
# icon_data_uri = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAA..."
# 若不使用 Data URI，也可拆分为：
# icon_mime = "image/png"
# icon_base64 = "iVBORw0KGgoAAAANSUhEUgAA..."
homepage_url = "https://example.com"
repository_url = "https://github.com/owner/repo"
license = "MIT"

author = { name = "作者名", email = "author@example.com", url = "https://example.com", links = { github = "https://github.com/owner", bilibili = "https://space.bilibili.com/123" } }

tags = ["light", "minimal"]

# 下载（二选一：download_path 或 assets；download_url 仅兼容不推荐）
download_path = "src/theme/my-theme.zip"

# 兼容：外部直链（不推荐）
# download_url = "https://example.com/my-theme.zip"

[[assets]]
name = "Theme Pack"
path = "src/theme/my-theme.zip"
url = "" # 不推荐；如确有需要可填外链
sha256 = ""
size_bytes = 0

[theme]
preview_url = "https://example.com/preview.png"
